name: Project validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
      - run: python scripts/verify_launch.py
      - run: python scripts/verify_fresh_run.py
      - run: python scripts/execute_notebook.py
